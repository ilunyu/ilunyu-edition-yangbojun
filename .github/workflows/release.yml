name: Publish resource package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/build_resource.py
      - run: sha256sum dist/resource.ilunyupack > dist/resource.ilunyupack.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/resource.ilunyupack
            dist/resource.ilunyupack.sha256
            dist/release.json
